version: 2

models:

  - name: provider_directory
    description: provider records including provider details, geographic location for analytics
    columns:
      - name: npi
        description: Unique provider identifier
      - name: provider_type
        description: Indicates the provider is an individual or organization
      - name: state
        description: Provider's state
      - name: county_fips
        description: Provider's county FIPS code
      - name: zip_code
        description: Provider's ZIP code

  - name: providers_by_geography
    description: healthcare providers by geography
    columns:
      - name: state
        description: State name
      - name: county
        description: County name
      - name: zip_code
        description: ZIP code
      - name: provider_count
        description: Number of providers in the geographic area

  - name: specialty_distribution
    description: provider specialties across regions with specialty mix by location
    columns:
      - name: state
        description: State name
      - name: county
        description: County name
      - name: classification
        description: Provider specialty classification
      - name: provider_count
        description: Number of providers in the specialty and location

  - name: provider_density
    description: Provider density as providers per capita using population data and geographic location
    columns:
      - name: state
        description: State name
      - name: county
        description: County name
      - name: population
        description: Total population
      - name: providers_per_capita
        description: Number of providers divided by population
